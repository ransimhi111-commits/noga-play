<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>בחירת טייס</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFC83D}a:hover{color:#FFE08A}
.space{background-color:#0E0A2E;background-size:cover;background-position:center}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fall{from{transform:translateY(-160px)}to{transform:translateY(720px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes popIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes launch{0%{transform:translateY(0)}100%{transform:translateY(-700px)}}
.shake{animation:shake .45s ease}
@keyframes coinTo{0%{transform:translate(0,0) scale(1.2);opacity:1}80%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.6);opacity:0}}
.cfly{position:absolute;z-index:61;pointer-events:none;font-size:40px;line-height:1;margin:-20px 0 0 -20px;animation:coinTo .8s cubic-bezier(.5,0,.75,.7) forwards}
@keyframes cbump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.coinpill{display:inline-flex;align-items:center;gap:6px;background:rgba(23,18,61,0.75);border:2px solid rgba(255,200,61,0.6);border-radius:999px;padding:4px 14px;font:700 24px Rubik,Fredoka,sans-serif;color:#FFE08A;white-space:nowrap}
.cbump{animation:cbump .4s ease-out}
.bob{animation:bob 3s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.popin{animation:popIn .35s cubic-bezier(.2,.9,.3,1.3) both}
.fall{animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
.launch{animation:launch 1s ease-in forwards}
/* victory */
@keyframes shipIn{from{transform:translateX(560px)}to{transform:translateX(0)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes beam{from{transform:scaleX(0);opacity:1}to{transform:scaleX(1);opacity:1}}
@keyframes beamOff{to{opacity:0}}
@keyframes burst{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1.9)}}
@keyframes hide{to{opacity:0}}
@keyframes flyAway{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}100%{opacity:0;transform:translate(-460px,-430px) rotate(-760deg) scale(.2)}}
@keyframes freeIt{0%{opacity:0;transform:translate(0,0) scale(.3)}60%{opacity:1}100%{opacity:1;transform:translate(330px,-215px) scale(.75)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.v-ship{animation:shipIn .8s cubic-bezier(.2,.9,.3,1.15) both}
.v-shipbob{animation:hover 2s ease-in-out .8s infinite}
.v-beam{transform:scaleX(0);transform-origin:right center;animation:beam .45s ease-out .85s forwards,beamOff .3s 1.45s forwards}
.v-burst{opacity:0;animation:burst .7s ease-out 1.2s both}
.v-alien{animation:hide .01s 1.25s forwards}
.v-dizzy{opacity:0;animation:flyAway 1.4s ease-in 1.25s forwards}
.v-free{opacity:0;animation:freeIt 1s cubic-bezier(.2,.9,.3,1.25) 1.45s forwards}
.v-text{opacity:0;animation:fadeUp .5s 2.3s forwards}
.v-tw{animation:twinkle 1.2s ease-in-out infinite}
</style>
</helmet>
<div class="space" dir="rtl" style="width: 1180px; height: 820px; box-sizing: border-box; padding: 24px 36px; display: flex; flex-direction: column; gap: 14px; font-family: Fredoka, Rubik, sans-serif; color: #FFFFFF; position: relative; overflow: hidden; background-image: linear-gradient(rgba(14,10,46,0.30), rgba(14,10,46,0.55)), url('assets/bg.jpg'); ">
  <audio id="aud-p_nir" src="audio/p_nir.mp3" preload="auto"></audio>
  <audio id="aud-p_luna" src="audio/p_luna.mp3" preload="auto"></audio>
  <audio id="aud-p_zik" src="audio/p_zik.mp3" preload="auto"></audio>
  <audio id="aud-p_tuti" src="audio/p_tuti.mp3" preload="auto"></audio>
  <audio id="aud-p_kochi" src="audio/p_kochi.mp3" preload="auto"></audio>
  <audio id="aud-p_tofi" src="audio/p_tofi.mp3" preload="auto"></audio>
  <audio id="aud-p_jet" src="audio/p_jet.mp3" preload="auto"></audio>
  <audio id="aud-p_mika" src="audio/p_mika.mp3" preload="auto"></audio>
  <audio id="aud-pilots" src="audio/pilots.mp3" preload="auto"></audio>
  <div style="display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 3">
    <a href="Story.dc.html" aria-label="חזרה לסיפור" style="width: 54px; height: 54px; border-radius: 50%; background: rgba(36,28,92,0.85); display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <span style="font-size: 36px; font-weight: 700; text-shadow: 0 3px 14px rgba(0,0,0,0.6)">בוחרים טייס</span>
    <div style="width: 54px"></div>
  </div>
  <div style="flex-grow: 1; display: flex; gap: 28px; align-items: center; min-height: 0">
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px">
      <sc-for list="{{pilots}}" as="p" hint-placeholder-count="8">
        <button onClick="{{p.pick}}" aria-label="{{p.n}}" class="{{p.cls}}" style="{{p.box}}">
          <span style="{{p.face}}"><svg width="70" height="70" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="30" r="20" fill="#FFE2C6"/><path d="M12 28a20 20 0 0 1 40 0v4H12z" fill="{{p.col}}"/><rect x="18" y="24" width="28" height="10" rx="5" fill="#7CC8FF" stroke="#FFFFFF" stroke-width="2"/><circle cx="26" cy="40" r="2" fill="#17123D"/><circle cx="38" cy="40" r="2" fill="#17123D"/><path d="M27 46q5 4 10 0" stroke="#17123D" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span>
          <span style="font-size: 26px; font-weight: 700">{{p.n}}</span>
        </button>
      </sc-for>
    </div>
    <div style="width: 270px; display: flex; flex-direction: column; align-items: center; gap: 12px; flex-shrink: 0">
      <div style="background: #FFFFFF; color: #17123D; border-radius: 24px 24px 6px 24px; padding: 14px 20px; font-size: 21px; font-weight: 600; line-height: 1.35; text-align: center">{{says}}</div>
      <div style="width: 250px; height: 330px; border-radius: 125px 125px 22px 22px; border: 3px solid #34D1BF; background: rgba(52,209,191,0.20); overflow: hidden; box-shadow: {{nogaGlow}}; flex-shrink: 0; position: relative">
      <video id="noga-vid" poster="assets/noga_talk2.webp" muted playsinline loop preload="auto" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 0%"><source src="video/noga-talk.mp4" type="video/mp4"><source src="video/noga-talk.webm" type="video/webm"></video>
    </div>
    </div>
  </div>
  <div style="display: flex; justify-content: center">
    <a href="Main.dc.html" class="{{goCls}}" style="{{goStyle}}">המראה!</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'></script>
</body>
</html>
