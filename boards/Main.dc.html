<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>מסך הבית – גשר החללית</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFC83D}a:hover{color:#FFE08A}
.space{background-color:#0E0A2E;background-size:cover;background-position:center}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fall{from{transform:translateY(-160px)}to{transform:translateY(720px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes popIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes launch{0%{transform:translateY(0)}100%{transform:translateY(-700px)}}
.shake{animation:shake .45s ease}
@keyframes coinTo{0%{transform:translate(0,0) scale(1.2);opacity:1}80%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.6);opacity:0}}
.cfly{position:absolute;z-index:61;pointer-events:none;font-size:40px;line-height:1;margin:-20px 0 0 -20px;animation:coinTo .8s cubic-bezier(.5,0,.75,.7) forwards}
@keyframes cbump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.coinpill{display:inline-flex;align-items:center;gap:6px;background:rgba(23,18,61,0.75);border:2px solid rgba(255,200,61,0.6);border-radius:999px;padding:4px 14px;font:700 24px Rubik,Fredoka,sans-serif;color:#FFE08A;white-space:nowrap}
.cbump{animation:cbump .4s ease-out}
.bob{animation:bob 3s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.popin{animation:popIn .35s cubic-bezier(.2,.9,.3,1.3) both}
.fall{animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
.launch{animation:launch 1s ease-in forwards}
/* victory */
@keyframes shipIn{from{transform:translateX(560px)}to{transform:translateX(0)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes beam{from{transform:scaleX(0);opacity:1}to{transform:scaleX(1);opacity:1}}
@keyframes beamOff{to{opacity:0}}
@keyframes burst{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1.9)}}
@keyframes hide{to{opacity:0}}
@keyframes flyAway{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}100%{opacity:0;transform:translate(-460px,-430px) rotate(-760deg) scale(.2)}}
@keyframes freeIt{0%{opacity:0;transform:translate(0,0) scale(.3)}60%{opacity:1}100%{opacity:1;transform:translate(330px,-215px) scale(.75)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.v-ship{animation:shipIn .8s cubic-bezier(.2,.9,.3,1.15) both}
.v-shipbob{animation:hover 2s ease-in-out .8s infinite}
.v-beam{transform:scaleX(0);transform-origin:right center;animation:beam .45s ease-out .85s forwards,beamOff .3s 1.45s forwards}
.v-burst{opacity:0;animation:burst .7s ease-out 1.2s both}
.v-alien{animation:hide .01s 1.25s forwards}
.v-dizzy{opacity:0;animation:flyAway 1.4s ease-in 1.25s forwards}
.v-free{opacity:0;animation:freeIt 1s cubic-bezier(.2,.9,.3,1.25) 1.45s forwards}
.v-text{opacity:0;animation:fadeUp .5s 2.3s forwards}
.v-tw{animation:twinkle 1.2s ease-in-out infinite}
</style>
</helmet>
<div class="space" dir="rtl" style="width: 1180px; height: 820px; box-sizing: border-box; padding: 24px 36px; display: flex; flex-direction: column; gap: 14px; font-family: Fredoka, Rubik, sans-serif; color: #FFFFFF; position: relative; overflow: hidden; background-image: linear-gradient(rgba(14,10,46,0.30), rgba(14,10,46,0.55)), url('assets/bg.jpg'); ">
  <audio id="home-audio" src="audio/home.mp3" preload="auto"></audio>
  <div style="display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 3">
    <div style="display: flex; align-items: center; gap: 10px; background: rgba(36,28,92,0.85); border-radius: 999px; padding: 6px 16px 6px 6px">
      <span style="width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FF7A59, #241C5C 75%); box-shadow: 0 0 14px #FF7A59"></span>
      <span style="font-size: 20px; font-weight: 600">{{pilotLabel}}</span>
    </div>
    <span style="font-size: 34px; font-weight: 700; color: #FFC83D; text-shadow: 0 3px 14px rgba(0,0,0,0.6)">גשר החללית</span>
    <div style="display: flex; align-items: center; gap: 12px">
      <button onClick="{{openShop}}" class="coinpill" aria-label="מטבעות – לחנות" style="cursor: pointer; font-size: 22px; padding: 7px 16px">🪙 {{coins}}</button>
      <div style="display: flex; align-items: center; gap: 6px; background: rgba(36,28,92,0.85); border-radius: 999px; padding: 8px 16px"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="#FFC83D"/></svg><span style="font-size: 22px; font-weight: 700">{{starCount}}</span></div>
      <a href="Parent.dc.html" aria-label="אזור הורים" style="width: 46px; height: 46px; border-radius: 50%; background: rgba(36,28,92,0.85); display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9C3F2" stroke-width="2.2" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></a>
    </div>
  </div>
  <div style="display: flex; align-items: center; justify-content: center; gap: 14px; position: relative; z-index: 3">
    <div style="display: flex; align-items: center; gap: 12px; background: rgba(36,28,92,0.85); border: 2px solid rgba(255,200,61,0.45); border-radius: 999px; padding: 6px 18px 6px 10px">
      <img src="{{shipImg}}" alt="" style="width: 54px; height: 36px; object-fit: contain; {{shipFx}}"><span style="font-size: 24px">{{petEmoji}}</span>
      <span style="font-size: 17px; color: #C9C3F2">הַחֲלָלִית שֶׁלָּכֶם:</span>
      <span style="font-size: 20px; font-weight: 700; color: #FFC83D">{{shipParts}}</span>
      <div style="display: flex; gap: 4px"><sc-for list="{{shipDots}}" as="d" hint-placeholder-count="21"><span style="{{d.s}}"></span></sc-for></div>
      <span style="font-size: 17px; color: #C9C3F2">· 📒 {{stickerCount}}</span>
    </div>
    <button onClick="{{openShop}}" class="pulse" style="display: flex; align-items: center; gap: 8px; background: #B48CFF; color: #17123D; border: 0; border-radius: 999px; padding: 10px 22px; font: 700 22px Fredoka, Rubik, sans-serif; cursor: pointer; box-shadow: 0 6px 0 #7A55C9">🛒 חֲנוּת הַחֲלָלִית</button>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 0">
    <div style="display: flex; align-items: center; gap: 22px">
      <button onClick="{{speak}}" style="max-width: 360px; display: flex; gap: 10px; align-items: flex-start; text-align: right; background: #FFFFFF; color: #17123D; border: 0; border-radius: 26px 26px 26px 6px; padding: 16px 22px; font-family: Fredoka, Rubik, sans-serif; font-size: 22px; font-weight: 600; line-height: 1.4; cursor: pointer">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF7A59" stroke-width="2.4" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/></svg>
        <span>שלום טייסים! ברוכים הבאים לגשר החללית. לאן טסים היום?</span>
      </button>
      <div style="position: relative">
        <div style="width: 260px; height: 360px; border-radius: 130px 130px 22px 22px; border: 3px solid #34D1BF; background: rgba(52,209,191,0.20); overflow: hidden; box-shadow: {{nogaGlow}}; flex-shrink: 0; position: relative">
      <video id="noga-vid" poster="assets/noga_talk2.webp" muted playsinline loop preload="auto" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 0%"><source src="video/noga-talk.mp4" type="video/mp4"><source src="video/noga-talk.webm" type="video/webm"></video>
    </div>
        <sc-for list="{{playHint}}" as="h" hint-placeholder-count="0">
          <button onClick="{{h.go}}" aria-label="נוגה מדברת" class="pulse" style="position: absolute; bottom: 14px; left: 50%; margin-left: -34px; width: 68px; height: 68px; border-radius: 50%; border: 0; background: #FFC83D; cursor: pointer; box-shadow: 0 0 30px rgba(255,200,61,0.8); display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="#17123D"/></svg></button>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px">
    <a href="Map.dc.html" style="display: flex; align-items: center; gap: 16px; background: #FF7A59; color: #17123D; border-radius: 30px; padding: 22px 24px; min-height: 120px; box-sizing: border-box; text-decoration: none; box-shadow: 0 8px 0 #C9503A, 0 0 30px rgba(255,122,89,0.5)"><span style="font-size: 58px; font-weight: 700; line-height: 1">א</span><span style="display: flex; flex-direction: column"><span style="font-size: 32px; font-weight: 700">עברית</span><span style="font-size: 17px">{{hebLabel}}</span></span></a>
    <a href="MapMath.dc.html" style="display: flex; align-items: center; gap: 16px; background: #FFC83D; color: #17123D; border-radius: 30px; padding: 22px 24px; min-height: 120px; box-sizing: border-box; text-decoration: none; box-shadow: 0 8px 0 #D49D10, 0 0 30px rgba(255,200,61,0.5)"><span style="font-size: 58px; font-weight: 700; line-height: 1">7</span><span style="display: flex; flex-direction: column"><span style="font-size: 32px; font-weight: 700">חשבון</span><span style="font-size: 17px">{{mathLabel}}</span></span></a>
    <a href="MapEng.dc.html" style="display: flex; align-items: center; gap: 16px; background: #34D1BF; color: #17123D; border-radius: 30px; padding: 22px 24px; min-height: 120px; box-sizing: border-box; text-decoration: none; box-shadow: 0 8px 0 #1F9C8E, 0 0 30px rgba(52,209,191,0.5)"><span style="font-size: 58px; font-weight: 700; line-height: 1">A</span><span style="display: flex; flex-direction: column"><span style="font-size: 32px; font-weight: 700">אנגלית</span><span style="font-size: 17px">{{engLabel}}</span></span></a>
  </div>
  <sc-if value="{{shopOn}}" hint-placeholder-val="{{false}}"><div class="popin" style="position: absolute; inset: 0; z-index: 50; background: rgba(10,7,36,0.96); display: flex; flex-direction: column; gap: 14px; padding: 24px 40px; box-sizing: border-box">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 36px; font-weight: 700; color: #FFC83D">🛒 חֲנוּת הַחֲלָלִית</span>
      <span class="coinpill" style="font-size: 28px">🪙 {{coins}}</span>
      <button onClick="{{closeShop}}" aria-label="סגירה" style="width: 72px; height: 72px; border-radius: 50%; border: 0; background: #241C5C; color: #FFFFFF; font-size: 32px; cursor: pointer">✕</button>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 26px; background: rgba(36,28,92,0.7); border-radius: 26px; padding: 10px">
      <span style="font-size: 64px; line-height: 1">{{hatBig}}</span>
      <img src="{{shipImg}}" alt="החללית" class="bob" style="width: 220px; height: 130px; object-fit: contain; {{shipFx}}">
      <span class="bob" style="font-size: 64px; line-height: 1">{{petEmoji}}</span>
    </div>
    <div style="display: flex; gap: 12px; justify-content: center">
      <sc-for list="{{shopTabs}}" as="t" hint-placeholder-count="3"><button onClick="{{t.go}}" style="{{t.style}}">{{t.label}}</button></sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px">
      <sc-for list="{{shopItems}}" as="it" hint-placeholder-count="6"><button onClick="{{it.tap}}" style="{{it.style}}">
        <sc-if value="{{it.isShip}}" hint-placeholder-val="{{false}}"><img src="{{shipImg}}" alt="" style="width: 110px; height: 66px; object-fit: contain; {{it.fx}}"></sc-if>
        <sc-if value="{{it.isEmoji}}" hint-placeholder-val="{{false}}"><span style="font-size: 58px; line-height: 66px">{{it.e}}</span></sc-if>
        <span style="font-size: 19px; font-weight: 700">{{it.name}}</span>
        <span style="{{it.tagStyle}}">{{it.tag}}</span>
      </button></sc-for>
    </div>
    <div style="text-align: center; font-size: 22px; color: #FFE08A; min-height: 30px">{{shopMsg}}</div>
  </div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'></script>
</body>
</html>
